amcl:
  ros__parameters:
    use_sim_time: True
    transform_tolerance: 0.5
    alpha1: 0.05 # nhieu khi xe xoay  
    alpha2: 0.03 # nhieu khi xe di thang
    alpha3: 0.05 # nhieu tinh iten khi xe di thang
    alpha4: 0.03 # nhieu tinh tien khi xe xoay tai cho
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    min_particles: 300
    max_particles: 3000
    update_min_d: 0.05 # cap nhat vi tri khi tinh tien
    update_min_a: 0.05 # cap nhat vi tri khi xoay

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_frame: base_footprint
    odom_frame: odom
    transform_tolerance: 0.2 # sai so thoi gian cho phep khi du lieu vi tri bi tre
    expected_planner_frequency: 3.0 # tan so cap nhat lai duong di
    always_replan: true
    bt_loop_duration: 10

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0 # trong 15 s xe phai di chuyen it nhat 0.1m neu ko se bao loi

    goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25 # sai so khi den dich theo x y
      yaw_goal_tolerance: 0.25 # sai so lech goc khi gan den dich

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      vx_samples: 20 # thu 20 gia tri van toc khac nhau
      vy_samples: 0
      vtheta_samples: 30 # thu 20 gia tri v goc khac nhau
      sim_time: 2.5 # tinh toan truoc di chuyen cua xe trong 2.5s
      linear_granularity: 0.05
      angular_granularity: 0.025
      max_vel_x: 0.5
      min_vel_x: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.1
      acc_lim_x: 2.0
      decel_lim_x: -2.0
      acc_lim_theta: 3.2
      decel_lim_theta: -3.2
      
      BaseObstacle.scale: 40.0 # trong so ne vat can
      PathAlign.scale: 20.0 # trong so bam huong duong di tong the
      GoalAlign.scale: 15.0 # trong so bam huong dich den
      PathDist.scale: 15.0 # trong so bam sat khoang cach duong di
      GoalDist.scale: 20.0 # trong so tien ve phia dich
      RotateToGoal.scale: 40.0 # trong so xoay tai cho khi den dich
      Oscillation.scale: 5.0 # trong so chong rung 

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.1
      use_astar: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: "map"
    local_frame: "odom"
    robot_base_frame: "base_footprint"
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6           # Giới hạn xoay cứu nguy an toàn (0.6 rad/s)
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0           # Gia tốc xoay đầm hơn, tránh giật giắc bánh xe
    enable_stamped_cmd_vel: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      transform_tolerance: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.19
      rolling_window: false
      track_unknown_space: true    # Cho phép tính toán cả vùng chưa biết
      width: 20                    # Mở rộng chiều rộng bản đồ tổng thành 20 mét
      height: 20                   # Mở rộng chiều cao bản đồ tổng thành 20 mét
      resolution: 0.05             # Độ phân giải ô lưới 5cm
      origin_x: -10.0              # Tọa độ gốc X để robot đứng ở vị trí (-3.51) vẫn nằm trong map
      origin_y: -10.0
      update_frequency: 1.0
      publish_frequency: 1.0
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        transform_tolerance: 0.1

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          sensor_frame: lidar_link
          topic: /scan
          data_type: LaserScan
          transform_tolerance: 0.5
          clearing: True
          marking: True
          inf_is_valid: true 
          reliability_policy: "BEST_EFFORT"
          durability_policy: "VOLATILE"
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0      
          obstacle_max_range: 5.0 
          max_obstacle_height: 2.0     
          min_obstacle_height: -0.1    
    # cau hinh voxel khi can su dung lidar 3d con bthg chi can lop obstacle la du
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.6
        cost_scaling_factor: 1.5

      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.19
      update_frequency: 10.0
      publish_frequency: 10.0
      transform_tolerance: 0.1
      always_send_full_costmap: true

      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        transform_tolerance: 0.1

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: LaserScan
          transform_tolerance: 0.5
          marking: True
          clearing: True
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          inf_is_valid: true
          raytrace_min_range: 0.0
          obstacle_min_range: 0.0
          reliability_policy: "BEST_EFFORT"
          durability_policy: "VOLATILE"

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.6
        cost_scaling_factor: 1.5  

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

velocity_smoother:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    transform_tolerance: 0.1
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 1.0
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.0
      max_height: 2.0
    polygons: ["stop_polygon", "slowdown_polygon"]
    stop_polygon:
      type: "polygon"
      points: "[[0.17, 0.13], [0.17, -0.13], [-0.17, -0.13], [-0.17, 0.13]]"
      action_type: "stop"
      min_points: 4
      visualize: True
      polygon_pub_topic: "polygon_stop"
    slowdown_polygon:
      type: "polygon"
      points: "[[0.5, 0.25], [0.5, -0.25], [-0.2, -0.25], [-0.2, 0.25]]"
      action_type: "slowdown"
      slowdown_ratio: 0.3
      min_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      dock_direction: "forward"

route_server:
  ros__parameters:
    use_sim_time: True
    enabled: false 

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ['global_costmap', 'local_costmap', 'controller_server', 'smoother_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother', 'docking_server']